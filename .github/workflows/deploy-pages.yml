# Deploys the UserInterface/ folder to GitHub Pages.
#
# One-time setup (repo owner): Settings -> Pages -> "Build and deployment"
# -> Source: "GitHub Actions". After that, every push to this branch (or a
# manual run from the Actions tab) publishes the site at:
#   https://<owner>.github.io/FinanceProject/
name: Deploy Business Analysis UI to GitHub Pages

on:
  push:
    branches: [claude/business-analysis-ui, main]
    paths: ["UserInterface/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: UserInterface
      - id: deployment
        uses: actions/deploy-pages@v4
